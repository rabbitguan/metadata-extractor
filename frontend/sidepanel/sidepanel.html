<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata Organizer</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="app-shell">
        <section id="startScreen" class="start-screen">
            <div class="start-hero">
                <h1 id="startTitle"><span>Meta</span><span>Extractor</span></h1>
                <p id="startDescription" class="start-description">请选择分析方式：分析网页 / 上传文件</p>
            </div>
            <div class="start-actions">
                <button id="chooseWebButton" class="start-button primary" type="button">
                    <span id="chooseWebLabel">分析网页</span>
                    <small id="chooseWebHint">提取当前页面并整理元数据</small>
                </button>
                <button id="chooseUploadButton" class="start-button secondary" type="button">
                    <span id="chooseUploadLabel">上传数据</span>
                    <small id="chooseUploadHint">上传 JSON / TXT 等文本文件</small>
                </button>
                <button id="chooseIdentifierButton" class="start-button secondary" type="button">
                    <span id="chooseIdentifierLabel">输入 DOI/CSTR</span>
                    <small id="chooseIdentifierHint">通过编号解析资源并整理元数据</small>
                </button>
            </div>
        </section>

        <div id="analysisWorkspace" hidden>
        <button id="homeButton" class="icon-button home-button" type="button" aria-label="返回初始页" title="返回初始页">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5.69 18.31 12H16v5h-4v-3H12v3H8v-5H5.69L12 5.69Zm0-3.18L2 12h3v7h6v-5h2v5h6v-7h3L12 2.5Z"/>
            </svg>
        </button>
        <header class="hero">
            <div class="hero-copy">
                <h1 id="appTitle"><span>Meta</span><span>Extractor</span></h1>
            </div>
            <div class="hero-actions">
                <div class="lang-toggle" role="group" aria-label="Language switcher">
                    <button id="langZhButton" class="lang-button active" type="button" data-language="zh">中</button>
                    <button id="langEnButton" class="lang-button" type="button" data-language="en">EN</button>
                </div>
                   <!-- removed small AI icon button per user request -->
                   <button id="refreshButton" class="icon-button" type="button" aria-label="重新加载" title="重新加载">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.3 0 2.5.42 3.48 1.14L13 9.62h7V2l-2.35 2.35Z"/>
                    </svg>
                </button>
                <button id="downloadButton" class="icon-button primary" type="button" aria-label="下载" title="下载">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 20h14v-2H5v2Zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1Z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="llm-row">
            <button id="llmExtractButton" class="upload-button" type="button">使用大模型提取</button>
        </div>

        <section class="mode-switcher" aria-label="元数据模式切换">
            <button class="mode-button active" data-mode="common" type="button">通用元数据项目表</button>
            <button class="mode-button" data-mode="domain" type="button">领域专用元数据项目表</button>
        </section>

        <section id="identifierSelector" class="identifier-selector" hidden>
            <label id="identifierSelectLabel" for="identifierSelect">选择标识符</label>
            <select id="identifierSelect" class="identifier-select"></select>
            <div id="identifierError" class="identifier-error" hidden></div>
        </section>

        <section id="uploadPanel" class="upload-panel" hidden>
            <div id="uploadIdleState" class="upload-state">
                <h2 id="uploadTitle">上传数据文件</h2>
                <p id="uploadDescription">支持文件格式：JSON / TXT / CSV / MD / XML / HTML / LOG</p>
                <button id="uploadButton" class="upload-button" type="button">选择文件</button>
            </div>
            <div id="uploadSelectedState" class="upload-state" hidden>
                <div id="selectedFileName" class="selected-file-name">尚未选择文件</div>
                <div class="upload-actions">
                    <button id="confirmUploadButton" class="upload-button primary-action" type="button">确认并分析</button>
                    <button id="reselectUploadButton" class="upload-button secondary-action" type="button">重新选择</button>
                </div>
                <input id="fileInput" type="file" accept=".json,.txt,.md,.csv,.xml,.html,.log,application/json,text/plain,text/csv,text/xml,text/html" hidden>
            </div>
        </section>

        <section id="identifierPanel" class="upload-panel" hidden>
            <div class="upload-state">
                <h2 id="identifierTitle">输入 DOI/CSTR</h2>
                <p id="identifierDescription">支持单个或多个 DOI / CSTR，多个编号可用换行、空格或逗号分隔</p>
                <textarea id="identifierInput" class="identifier-input" rows="5" placeholder="10.xxxx/example 或 12345.12.123456.123456"></textarea>
                <div class="upload-actions">
                    <button id="confirmIdentifierButton" class="upload-button primary-action" type="button">确认并分析</button>
                    <button id="clearIdentifierButton" class="upload-button secondary-action" type="button">清空</button>
                </div>
            </div>
        </section>

        <div id="status" class="status idle" hidden></div>

        <main id="analysisContent" class="content">
            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2 id="modeTitle">通用元数据项目表</h2>
                    </div>
                    <span id="lastUpdated" class="panel-meta"></span>
                </div>
                <div id="metadataRoot" class="metadata-root"></div>
            </section>

            <section class="panel extension-panel">
                <div class="panel-head">
                    <div>
                        <h2 id="extensionTitle">扩展信息</h2>
                    </div>
                </div>
                <pre id="extensionInfo" class="extension-info empty">等待提取结果</pre>
            </section>
        </main>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
