# Example Nginx config for the mapping-tool service.
#
# Platform entry:
#   http://<platform-host>/sso/proxy/mapping-tool/
#
# The platform gateway strips /sso/proxy/mapping-tool before forwarding to this
# server. Therefore this Nginx serves the frontend at / and proxies API paths to
# the separately deployed Flask backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /query {
        proxy_pass http://127.0.0.1:4000/query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Email $http_x_user_email;
    }

    location = /register {
        proxy_pass http://127.0.0.1:4000/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Email $http_x_user_email;
    }

    location = /history {
        proxy_pass http://127.0.0.1:4000/history;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Email $http_x_user_email;
    }

    location = /history/lookup {
        proxy_pass http://127.0.0.1:4000/history/lookup;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Email $http_x_user_email;
    }

    location = /user {
        proxy_pass http://127.0.0.1:4000/user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-User-Email $http_x_user_email;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
